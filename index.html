<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Bot — Private Owner Panel</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 1.5rem; }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0369a1; }

        .dashboard { display: none; text-align: left; }
        .card {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .status-val { font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-box">
            <h1>💎 Diamond Shield Access</h1>
            <p>Enter your secret key to view dashboard:</p>
            <input type="password" id="passkey" placeholder="Enter Secret Key">
            <br>
            <button onclick="checkAccess()">Unlock Dashboard</button>
            <p id="error-msg" style="color: #f87171; font-size: 0.9rem; margin-top: 10px;"></p>
        </div>

        <div id="dashboard" class="dashboard">
            <h1>💎 Owner Control Panel</h1>
            <div class="card">
                <strong>Status:</strong> <span id="bot-status" class="status-val">Loading...</span><br>
                <strong>Servers:</strong> <span id="bot-guilds" class="status-val">-</span><br>
                <strong>Users:</strong> <span id="bot-users" class="status-val">-</span><br>
                <strong>Ping:</strong> <span id="bot-ping" class="status-val">-</span>
            </div>

            <div class="card">
                <h3>⚡ Active Cogs</h3>
                <ul>
                    <li>🎫 Tickets & Modals</li>
                    <li>📜 𝔻𝕚𝕒𝕞𝕠𝕟𝕕-𝕃𝕠𝕘𝕤 System</li>
                    <li>🛡️ Antinuke & Antiraid</li>
                    <li>📖 Ethiopian Orthodox Bible</li>
                </ul>
            </div>
            <br>
            <button onclick="logout()" style="background: #ef4444;">Lock Panel</button>
        </div>
    </div>

    <script>
        const MY_SECRET_KEY = "DiamondOwner2026!";
        
        // YOUR WISPBYTE SERVER IP & PORT
        const WISPBYTE_API_URL = "http://78.154.103.35:13895/api/stats";

        async function fetchBotStats() {
            try {
                const response = await fetch(WISPBYTE_API_URL, {
                    headers: {
                        "Authorization": `Bearer ${MY_SECRET_KEY}`
                    }
                });

                if (!response.ok) throw new Error("Unauthorized");

                const data = await response.json();
                document.getElementById('bot-status').innerText = data.status;
                document.getElementById('bot-status').style.color = "#4ade80";
                document.getElementById('bot-guilds').innerText = data.guilds;
                document.getElementById('bot-users').innerText = data.users;
                document.getElementById('bot-ping').innerText = data.ping + " ms";
            } catch (err) {
                document.getElementById('bot-status').innerText = "Offline / Connection Error";
                document.getElementById('bot-status').style.color = "#f87171";
            }
        }

        function checkAccess() {
            const enteredKey = document.getElementById('passkey').value;
            if (enteredKey === MY_SECRET_KEY) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
                // Fetch stats immediately & set loop every 10 seconds
                fetchBotStats();
                setInterval(fetchBotStats, 10000);
            } else {
                document.getElementById('error-msg').innerText = "❌ Incorrect Key Access Denied!";
            }
        }

        function logout() {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('passkey').value = '';
            document.getElementById('error-msg').innerText = '';
        }
    </script>

</body>
</html>
